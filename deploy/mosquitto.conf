# Mosquitto MQTT broker configuration for WiFi CSI system.
# Optimised for high-throughput CSI data (100 Hz per RX board × 12 boards).

# ── Listeners ──
listener 1883

# Allow anonymous connections from ESP32 boards on the local network.
# Security note: this is a private LAN deployment; TLS can be layered later.
allow_anonymous true

# ── Performance ──
# Max queued messages per client (default 1000 is fine for CSI).
max_queued_messages 1000

# Max in-flight QoS 1/2 messages.  CSI uses QoS 0 so this is a safety net.
max_inflight_messages 20

# Message size limit — CSI packets are 478 bytes; 1 KB is generous.
message_size_limit 1024

# ── Persistence ──
# Disable persistence — CSI data is ephemeral; no need to survive broker restarts.
persistence false

# ── Logging ──
log_dest syslog
log_type error
log_type warning
log_type subscribe
log_type unsubscribe
# Uncomment for debugging:
# log_type all

# ── Connection limits ──
# 12 ESP32 boards + backend subscriber + headroom
max_connections 20
