<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" class="floorplan" data-floor="3">
  <defs>
    <pattern id="grid3" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0,255,255,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background grid -->
  <rect width="1800" height="1050" fill="url(#grid3)" class="floor-bg"/>

  <!-- ═══ Rooms ═══ -->
  <g class="rooms">
    <!-- Storage: upper-left (with irregular wall jog matching 1st floor) -->
    <rect x="0" y="0" width="650" height="500" class="room" data-room="storage"/>
    <!-- Art Studio: lower-left -->
    <rect x="0" y="550" width="850" height="500" class="room" data-room="art_studio"/>
    <!-- Hallway: central corridor around stairwell -->
    <rect x="650" y="400" width="200" height="200" class="room room-hallway" data-room="hallway"/>
    <!-- Recreation Area: upper-right, large room -->
    <rect x="850" y="0" width="950" height="550" class="room" data-room="recreation"/>
    <!-- Bar Area: lower-center (dashed divider from Workshop) -->
    <rect x="850" y="550" width="500" height="500" class="room" data-room="bar_area"/>
    <!-- Workshop: lower-right -->
    <rect x="1350" y="550" width="450" height="500" class="room" data-room="workshop"/>
  </g>

  <!-- ═══ Walls (exterior) ═══ -->
  <g class="walls">
    <!-- Top wall with jog matching 1st floor footprint -->
    <line x1="0" y1="0" x2="400" y2="0" class="wall wall-exterior"/>
    <line x1="400" y1="0" x2="400" y2="80" class="wall wall-exterior"/>
    <line x1="400" y1="80" x2="500" y2="80" class="wall wall-exterior"/>
    <line x1="500" y1="80" x2="500" y2="0" class="wall wall-exterior"/>
    <line x1="500" y1="0" x2="1800" y2="0" class="wall wall-exterior"/>
    <!-- Right wall -->
    <line x1="1800" y1="0" x2="1800" y2="1050" class="wall wall-exterior"/>
    <!-- Bottom wall -->
    <line x1="0" y1="1050" x2="1800" y2="1050" class="wall wall-exterior"/>
    <!-- Left wall -->
    <line x1="0" y1="0" x2="0" y2="1050" class="wall wall-exterior"/>

    <!-- ── Interior walls ── -->

    <!-- Storage south wall (y=500) -->
    <line x1="0" y1="500" x2="450" y2="500" class="wall wall-interior"/>
    <line x1="550" y1="500" x2="650" y2="500" class="wall wall-interior"/>

    <!-- Art Studio north wall (y=550) -->
    <line x1="0" y1="550" x2="650" y2="550" class="wall wall-interior"/>
    <line x1="850" y1="550" x2="1800" y2="550" class="wall wall-interior"/>

    <!-- Storage/Art Studio east wall (x=650) upper -->
    <line x1="650" y1="0" x2="650" y2="400" class="wall wall-interior"/>
    <line x1="650" y1="600" x2="650" y2="1050" class="wall wall-interior"/>

    <!-- Art Studio / Bar Area divider (x=850) lower -->
    <line x1="850" y1="550" x2="850" y2="750" class="wall wall-interior"/>
    <line x1="850" y1="900" x2="850" y2="1050" class="wall wall-interior"/>

    <!-- Recreation / lower rooms divider (y=550) at x=850 to 1800 -->
    <!-- Already drawn above -->

    <!-- Bar Area / Workshop divider (x=1350) — DASHED (partial wall) -->
    <line x1="1350" y1="550" x2="1350" y2="700" class="wall wall-interior" stroke-dasharray="12,8"/>
    <line x1="1350" y1="700" x2="1350" y2="1050" class="wall wall-interior" stroke-dasharray="12,8"/>

    <!-- Hallway walls -->
    <line x1="650" y1="400" x2="850" y2="400" class="wall wall-interior"/>
    <line x1="650" y1="600" x2="850" y2="600" class="wall wall-interior"/>

    <!-- Stairwell -->
    <rect x="670" y="420" width="160" height="160" class="stairwell" data-stairwell="down"/>
  </g>

  <!-- ═══ Doors ═══ -->
  <g class="doors">
    <!-- Storage → Hallway (gap in y=500 wall) -->
    <line x1="450" y1="500" x2="550" y2="500" class="door"/>
    <!-- Art Studio → Bar Area (gap in x=850 wall) -->
    <line x1="850" y1="750" x2="850" y2="900" class="door"/>
    <!-- Recreation → Hallway (gap in x=850 wall at y=400-550) -->
    <line x1="850" y1="400" x2="850" y2="550" class="door"/>
    <!-- Storage → Art Studio (gap between rooms) -->
    <line x1="650" y1="450" x2="650" y2="550" class="door"/>
  </g>

  <!-- ═══ Windows ═══ -->
  <g class="windows">
    <!-- Storage windows (left + top) -->
    <line x1="0" y1="100" x2="0" y2="350" class="window"/>
    <line x1="100" y1="0" x2="300" y2="0" class="window"/>
    <!-- Art Studio windows (left + bottom) -->
    <line x1="0" y1="650" x2="0" y2="900" class="window"/>
    <line x1="100" y1="1050" x2="400" y2="1050" class="window"/>
    <!-- Recreation Area windows (top + right) -->
    <line x1="1000" y1="0" x2="1300" y2="0" class="window"/>
    <line x1="1500" y1="0" x2="1750" y2="0" class="window"/>
    <line x1="1800" y1="100" x2="1800" y2="400" class="window"/>
    <!-- Bar Area window (bottom) -->
    <line x1="950" y1="1050" x2="1200" y2="1050" class="window"/>
    <!-- Workshop windows (right + bottom) -->
    <line x1="1800" y1="650" x2="1800" y2="900" class="window"/>
    <line x1="1450" y1="1050" x2="1700" y2="1050" class="window"/>
  </g>

  <!-- ═══ Room Labels ═══ -->
  <g class="room-labels">
    <text x="325" y="260" class="label">Storage</text>
    <text x="425" y="800" class="label">Art Studio</text>
    <text x="750" y="520" class="label label-tiny">▼ DOWN</text>
    <text x="1325" y="280" class="label">Recreation Area</text>
    <text x="1100" y="800" class="label">Bar Area</text>
    <text x="1575" y="800" class="label label-small">Workshop</text>
  </g>

  <!-- ═══ Sensor positions ═══ -->
  <g class="sensors">
    <circle cx="1325" cy="280" r="8" class="sensor sensor-tx"/>
    <circle cx="50" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="1750" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="50" cy="1000" r="6" class="sensor sensor-rx"/>
  </g>
</svg>
