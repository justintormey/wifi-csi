<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" class="floorplan" data-floor="3">
  <defs>
    <pattern id="grid3" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0,255,255,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background grid -->
  <rect width="1800" height="1050" fill="url(#grid3)" class="floor-bg"/>

  <!-- ═══ Rooms ═══ -->
  <g class="rooms">
    <!-- Workshop: top-left -->
    <rect x="0" y="0" width="700" height="550" class="room" data-room="workshop"/>
    <!-- Bar Area: top-right -->
    <rect x="700" y="0" width="550" height="550" class="room" data-room="bar_area"/>
    <!-- Art Studio: far top-right -->
    <rect x="1250" y="0" width="550" height="550" class="room" data-room="art_studio"/>
    <!-- Hallway: central corridor -->
    <rect x="500" y="550" width="800" height="200" class="room room-hallway" data-room="hallway"/>
    <!-- Recreation Area: bottom-left, largest room with bump-out -->
    <rect x="0" y="550" width="500" height="500" class="room" data-room="recreation"/>
    <!-- Storage: bottom-right -->
    <rect x="1300" y="550" width="500" height="500" class="room" data-room="storage"/>
  </g>

  <!-- ═══ Walls (exterior) ═══ -->
  <g class="walls">
    <!-- Top wall -->
    <line x1="0" y1="0" x2="1800" y2="0" class="wall wall-exterior"/>
    <!-- Left wall (with bump-out for recreation area) -->
    <line x1="0" y1="0" x2="0" y2="550" class="wall wall-exterior"/>
    <line x1="0" y1="550" x2="0" y2="1050" class="wall wall-exterior"/>
    <!-- Bottom wall -->
    <line x1="0" y1="1050" x2="1800" y2="1050" class="wall wall-exterior"/>
    <!-- Right wall -->
    <line x1="1800" y1="0" x2="1800" y2="1050" class="wall wall-exterior"/>

    <!-- Interior walls -->
    <!-- Workshop / Bar Area divider -->
    <line x1="700" y1="0" x2="700" y2="200" class="wall wall-interior"/>
    <line x1="700" y1="340" x2="700" y2="550" class="wall wall-interior"/>
    <!-- Bar Area / Art Studio divider -->
    <line x1="1250" y1="0" x2="1250" y2="200" class="wall wall-interior"/>
    <line x1="1250" y1="340" x2="1250" y2="550" class="wall wall-interior"/>
    <!-- Top rooms to hallway (y=550) -->
    <line x1="0" y1="550" x2="500" y2="550" class="wall wall-interior"/>
    <line x1="500" y1="550" x2="630" y2="550" class="wall wall-interior"/>
    <line x1="770" y1="550" x2="1050" y2="550" class="wall wall-interior"/>
    <line x1="1150" y1="550" x2="1300" y2="550" class="wall wall-interior"/>
    <line x1="1300" y1="550" x2="1800" y2="550" class="wall wall-interior"/>
    <!-- Recreation area east wall -->
    <line x1="500" y1="550" x2="500" y2="1050" class="wall wall-interior"/>
    <!-- Hallway south wall -->
    <line x1="500" y1="750" x2="1300" y2="750" class="wall wall-interior"/>
    <!-- Storage west wall -->
    <line x1="1300" y1="550" x2="1300" y2="1050" class="wall wall-interior"/>

    <!-- Stairwell (matching floors above) -->
    <rect x="850" y="560" width="180" height="180" class="stairwell" data-stairwell="down"/>
  </g>

  <!-- ═══ Doors ═══ -->
  <g class="doors">
    <!-- Workshop → Bar Area -->
    <line x1="700" y1="200" x2="700" y2="340" class="door"/>
    <!-- Bar Area → Art Studio -->
    <line x1="1250" y1="200" x2="1250" y2="340" class="door"/>
    <!-- Workshop → Hallway -->
    <line x1="630" y1="550" x2="770" y2="550" class="door"/>
    <!-- Art Studio → Hallway -->
    <line x1="1050" y1="550" x2="1150" y2="550" class="door"/>
    <!-- Recreation Area → Hallway -->
    <line x1="500" y1="590" x2="500" y2="710" class="door"/>
    <!-- Hallway → Storage -->
    <line x1="1300" y1="600" x2="1300" y2="730" class="door"/>
  </g>

  <!-- ═══ Windows ═══ -->
  <g class="windows">
    <!-- Workshop windows -->
    <line x1="150" y1="0" x2="350" y2="0" class="window"/>
    <line x1="0" y1="100" x2="0" y2="300" class="window"/>
    <!-- Bar Area window -->
    <line x1="850" y1="0" x2="1050" y2="0" class="window"/>
    <!-- Art Studio windows -->
    <line x1="1400" y1="0" x2="1650" y2="0" class="window"/>
    <line x1="1800" y1="100" x2="1800" y2="350" class="window"/>
    <!-- Recreation Area windows -->
    <line x1="0" y1="650" x2="0" y2="850" class="window"/>
  </g>

  <!-- ═══ Room Labels ═══ -->
  <g class="room-labels">
    <text x="350" y="290" class="label">Workshop</text>
    <text x="975" y="290" class="label">Bar Area</text>
    <text x="1525" y="290" class="label">Art Studio</text>
    <text x="900" y="665" class="label label-small">Hallway</text>
    <text x="250" y="810" class="label">Recreation<tspan x="250" dy="30">Area</tspan></text>
    <text x="1550" y="810" class="label">Storage</text>
    <text x="940" y="670" class="label label-tiny">▼ DOWN</text>
  </g>

  <!-- ═══ Sensor positions ═══ -->
  <g class="sensors">
    <circle cx="900" cy="525" r="8" class="sensor sensor-tx"/>
    <circle cx="50" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="1750" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="50" cy="1000" r="6" class="sensor sensor-rx"/>
  </g>
</svg>
