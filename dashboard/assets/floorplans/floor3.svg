<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" class="floorplan" data-floor="3">
  <defs>
    <pattern id="grid3" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0,255,255,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background grid -->
  <rect width="1800" height="1050" fill="url(#grid3)" class="floor-bg"/>

  <!-- ═══ Rooms ═══ -->
  <g class="rooms">
    <!-- Office: x:0 y:0 w:7m h:5.5m -->
    <rect x="0" y="0" width="700" height="550" class="room" data-room="office"/>
    <!-- Media Room: x:7 y:0 w:11m h:5.5m -->
    <rect x="700" y="0" width="1100" height="550" class="room" data-room="media_room"/>
    <!-- Storage: x:0 y:5.5 w:5m h:5m -->
    <rect x="0" y="550" width="500" height="500" class="room" data-room="storage"/>
    <!-- Hallway: x:5 y:5.5 w:8m h:2m -->
    <rect x="500" y="550" width="800" height="200" class="room room-hallway" data-room="hallway"/>
    <!-- Half Bath: x:13 y:5.5 w:3m h:2.5m -->
    <rect x="1300" y="550" width="300" height="250" class="room" data-room="bathroom"/>
    <!-- Utility: x:13 y:8 w:3m h:2.5m -->
    <rect x="1300" y="800" width="300" height="250" class="room" data-room="utility"/>
    <!-- Bonus Room: x:16 y:5.5 w:2m h:5m -->
    <rect x="1600" y="550" width="200" height="500" class="room" data-room="bonus"/>
    <!-- Mechanical closet under eaves: x:5 y:7.5 w:8 h:3 -->
    <rect x="500" y="750" width="800" height="300" class="room room-mechanical" data-room="mechanical"/>
  </g>

  <!-- ═══ Walls (exterior) ═══ -->
  <g class="walls">
    <!-- Top wall -->
    <line x1="0" y1="0" x2="1800" y2="0" class="wall wall-exterior"/>
    <!-- Left wall -->
    <line x1="0" y1="0" x2="0" y2="1050" class="wall wall-exterior"/>
    <!-- Bottom wall -->
    <line x1="0" y1="1050" x2="1800" y2="1050" class="wall wall-exterior"/>
    <!-- Right wall -->
    <line x1="1800" y1="0" x2="1800" y2="1050" class="wall wall-exterior"/>

    <!-- Interior walls -->
    <!-- Office/Media divider -->
    <line x1="700" y1="0" x2="700" y2="200" class="wall wall-interior"/>
    <line x1="700" y1="340" x2="700" y2="550" class="wall wall-interior"/>
    <!-- Top rooms to hallway/lower -->
    <line x1="0" y1="550" x2="500" y2="550" class="wall wall-interior"/>
    <line x1="500" y1="550" x2="630" y2="550" class="wall wall-interior"/>
    <line x1="770" y1="550" x2="1300" y2="550" class="wall wall-interior"/>
    <line x1="1300" y1="550" x2="1800" y2="550" class="wall wall-interior"/>
    <!-- Storage east wall -->
    <line x1="500" y1="550" x2="500" y2="1050" class="wall wall-interior"/>
    <!-- Hallway south wall -->
    <line x1="500" y1="750" x2="1300" y2="750" class="wall wall-interior"/>
    <!-- Bathroom/Utility divider -->
    <line x1="1300" y1="800" x2="1600" y2="800" class="wall wall-interior"/>
    <!-- Utility/Bonus divider -->
    <line x1="1600" y1="550" x2="1600" y2="1050" class="wall wall-interior"/>
    <!-- Bathroom west wall -->
    <line x1="1300" y1="550" x2="1300" y2="1050" class="wall wall-interior"/>

    <!-- Stairwell (matching floors below) -->
    <rect x="850" y="560" width="180" height="180" class="stairwell" data-stairwell="down"/>
  </g>

  <!-- ═══ Doors ═══ -->
  <g class="doors">
    <!-- Office → Media Room -->
    <line x1="700" y1="200" x2="700" y2="340" class="door"/>
    <!-- Office → Hallway -->
    <line x1="630" y1="550" x2="770" y2="550" class="door"/>
    <!-- Storage → Hallway -->
    <line x1="500" y1="590" x2="500" y2="710" class="door"/>
    <!-- Hallway → Bathroom -->
    <line x1="1300" y1="600" x2="1300" y2="730" class="door"/>
    <!-- Bathroom → Utility (internal) -->
    <line x1="1380" y1="800" x2="1520" y2="800" class="door"/>
    <!-- Hallway → Bonus -->
    <line x1="1600" y1="600" x2="1600" y2="730" class="door"/>
    <!-- Hallway → Mechanical -->
    <line x1="700" y1="750" x2="850" y2="750" class="door"/>
  </g>

  <!-- ═══ Windows ═══ -->
  <g class="windows">
    <!-- Office windows (dormer) -->
    <line x1="150" y1="0" x2="350" y2="0" class="window"/>
    <line x1="0" y1="100" x2="0" y2="300" class="window"/>
    <!-- Media room windows -->
    <line x1="900" y1="0" x2="1150" y2="0" class="window"/>
    <line x1="1400" y1="0" x2="1650" y2="0" class="window"/>
    <line x1="1800" y1="100" x2="1800" y2="350" class="window"/>
    <!-- Bonus room window -->
    <line x1="1800" y1="650" x2="1800" y2="850" class="window"/>
  </g>

  <!-- ═══ Room Labels ═══ -->
  <g class="room-labels">
    <text x="350" y="290" class="label">Office</text>
    <text x="1250" y="290" class="label">Media Room</text>
    <text x="250" y="810" class="label">Storage</text>
    <text x="900" y="665" class="label label-small">Hallway</text>
    <text x="1450" y="690" class="label label-small">Half Bath</text>
    <text x="1450" y="940" class="label label-tiny">Utility</text>
    <text x="1700" y="810" class="label label-tiny">Bonus</text>
    <text x="900" y="920" class="label label-tiny">Mechanical</text>
    <text x="940" y="670" class="label label-tiny">▼ DOWN</text>
  </g>

  <!-- ═══ Sensor positions ═══ -->
  <g class="sensors">
    <circle cx="900" cy="525" r="8" class="sensor sensor-tx"/>
    <circle cx="50" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="1750" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="50" cy="1000" r="6" class="sensor sensor-rx"/>
  </g>
</svg>
