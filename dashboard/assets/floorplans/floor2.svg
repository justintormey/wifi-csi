<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1800" class="floorplan" data-floor="2">
  <defs>
    <pattern id="grid2" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0,255,255,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background grid -->
  <rect width="1050" height="1800" fill="url(#grid2)" class="floor-bg"/>

  <!-- ═══ Rooms ═══ -->
  <g class="rooms">
    <!-- Bedroom #1: top-left -->
    <rect x="0" y="0" width="550" height="550" class="room" data-room="bedroom1"/>
    <!-- Bedroom #2: top-right -->
    <rect x="550" y="0" width="500" height="550" class="room" data-room="bedroom2"/>
    <!-- Guest Bedroom: middle-left, large -->
    <rect x="0" y="550" width="550" height="500" class="room" data-room="guest_bedroom"/>
    <!-- Hallway: central landing with stairwell -->
    <rect x="350" y="550" width="400" height="200" class="room room-hallway" data-room="hallway"/>
    <!-- Bathroom: middle-right upper -->
    <rect x="700" y="550" width="350" height="300" class="room" data-room="bathroom"/>
    <!-- Closet: middle-right lower -->
    <rect x="700" y="850" width="350" height="200" class="room" data-room="closet"/>
    <!-- Master Bedroom: bottom, full width -->
    <rect x="0" y="1050" width="1050" height="750" class="room" data-room="master_bedroom"/>
  </g>

  <!-- ═══ Walls (exterior) ═══ -->
  <g class="walls">
    <line x1="0" y1="0" x2="1050" y2="0" class="wall wall-exterior"/>
    <line x1="0" y1="0" x2="0" y2="1800" class="wall wall-exterior"/>
    <line x1="0" y1="1800" x2="1050" y2="1800" class="wall wall-exterior"/>
    <line x1="1050" y1="0" x2="1050" y2="1800" class="wall wall-exterior"/>

    <!-- Interior walls -->
    <!-- Bedroom 1 / Bedroom 2 divider (x=550) -->
    <line x1="550" y1="0" x2="550" y2="200" class="wall wall-interior"/>
    <line x1="550" y1="350" x2="550" y2="550" class="wall wall-interior"/>
    <!-- Top rooms / lower section (y=550) -->
    <line x1="0" y1="550" x2="350" y2="550" class="wall wall-interior"/>
    <line x1="550" y1="550" x2="700" y2="550" class="wall wall-interior"/>
    <line x1="700" y1="550" x2="1050" y2="550" class="wall wall-interior"/>
    <!-- Guest bedroom east wall -->
    <line x1="550" y1="550" x2="550" y2="750" class="wall wall-interior"/>
    <line x1="550" y1="850" x2="550" y2="1050" class="wall wall-interior"/>
    <!-- Hallway south wall (y=750) -->
    <line x1="350" y1="750" x2="700" y2="750" class="wall wall-interior"/>
    <!-- Bathroom west wall (x=700) -->
    <line x1="700" y1="550" x2="700" y2="1050" class="wall wall-interior"/>
    <!-- Bathroom / Closet divider (y=850) -->
    <line x1="700" y1="850" x2="1050" y2="850" class="wall wall-interior"/>
    <!-- Master bedroom top wall (y=1050) -->
    <line x1="0" y1="1050" x2="550" y2="1050" class="wall wall-interior"/>
    <line x1="700" y1="1050" x2="1050" y2="1050" class="wall wall-interior"/>

    <!-- Stairwell -->
    <rect x="420" y="560" width="120" height="180" class="stairwell" data-stairwell="both"/>
  </g>

  <!-- ═══ Doors ═══ -->
  <g class="doors">
    <!-- Bedroom 1 ↔ Bedroom 2 -->
    <line x1="550" y1="200" x2="550" y2="350" class="door"/>
    <!-- Bedroom 1 → Hallway -->
    <line x1="350" y1="550" x2="550" y2="550" class="door"/>
    <!-- Bedroom 2 → Hallway -->
    <line x1="550" y1="550" x2="700" y2="550" class="door"/>
    <!-- Guest Bedroom → Hallway -->
    <line x1="550" y1="750" x2="550" y2="850" class="door"/>
    <!-- Hallway → Bathroom -->
    <line x1="700" y1="600" x2="700" y2="730" class="door"/>
    <!-- Bathroom → Closet -->
    <line x1="750" y1="850" x2="900" y2="850" class="door"/>
    <!-- Guest/Hallway → Master Bedroom -->
    <line x1="550" y1="1050" x2="700" y2="1050" class="door"/>
  </g>

  <!-- ═══ Windows ═══ -->
  <g class="windows">
    <!-- Bedroom 1 windows -->
    <line x1="100" y1="0" x2="300" y2="0" class="window"/>
    <line x1="0" y1="100" x2="0" y2="300" class="window"/>
    <!-- Bedroom 2 windows -->
    <line x1="650" y1="0" x2="850" y2="0" class="window"/>
    <line x1="1050" y1="100" x2="1050" y2="300" class="window"/>
    <!-- Guest Bedroom windows -->
    <line x1="0" y1="600" x2="0" y2="800" class="window"/>
    <!-- Bathroom window -->
    <line x1="1050" y1="600" x2="1050" y2="800" class="window"/>
    <!-- Master Bedroom windows -->
    <line x1="0" y1="1200" x2="0" y2="1500" class="window"/>
    <line x1="1050" y1="1200" x2="1050" y2="1500" class="window"/>
    <line x1="200" y1="1800" x2="500" y2="1800" class="window"/>
    <line x1="600" y1="1800" x2="900" y2="1800" class="window"/>
  </g>

  <!-- ═══ Room Labels ═══ -->
  <g class="room-labels">
    <text x="275" y="280" class="label">Bedroom #1</text>
    <text x="800" y="280" class="label">Bedroom #2</text>
    <text x="275" y="800" class="label">Guest<tspan x="275" dy="35">Bedroom</tspan></text>
    <text x="525" y="665" class="label label-tiny">▲▼ STAIRS</text>
    <text x="875" y="710" class="label label-small">Bathroom</text>
    <text x="875" y="955" class="label label-small">Closet</text>
    <text x="525" y="1420" class="label">Master Bedroom</text>
  </g>

  <!-- ═══ Sensor positions ═══ -->
  <g class="sensors">
    <circle cx="525" cy="525" r="8" class="sensor sensor-tx"/>
    <circle cx="50" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="1000" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="50" cy="1750" r="6" class="sensor sensor-rx"/>
  </g>
</svg>
