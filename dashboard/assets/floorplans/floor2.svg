<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" class="floorplan" data-floor="2">
  <defs>
    <pattern id="grid2" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0,255,255,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background grid -->
  <rect width="1800" height="1050" fill="url(#grid2)" class="floor-bg"/>

  <!-- ═══ Rooms ═══ -->
  <g class="rooms">
    <!-- Bedroom #1: top-left -->
    <rect x="0" y="0" width="550" height="550" class="room" data-room="bedroom1"/>
    <!-- Bedroom #2: top-center -->
    <rect x="550" y="0" width="500" height="550" class="room" data-room="bedroom2"/>
    <!-- Guest Bedroom: top-right -->
    <rect x="1050" y="0" width="750" height="550" class="room" data-room="guest_bedroom"/>
    <!-- Hallway: central corridor -->
    <rect x="350" y="550" width="800" height="200" class="room room-hallway" data-room="hallway"/>
    <!-- Master Bedroom: bottom-left, largest room -->
    <rect x="0" y="550" width="350" height="500" class="room" data-room="master_bedroom"/>
    <!-- Bathroom: bottom-center -->
    <rect x="1150" y="550" width="350" height="500" class="room" data-room="bathroom"/>
    <!-- Closet: bottom-right (master closet) -->
    <rect x="1500" y="550" width="300" height="500" class="room" data-room="closet"/>
    <!-- Landing area below hallway -->
    <rect x="350" y="750" width="800" height="300" class="room" data-room="master_bedroom"/>
  </g>

  <!-- ═══ Walls (exterior) ═══ -->
  <g class="walls">
    <!-- Top wall -->
    <line x1="0" y1="0" x2="1800" y2="0" class="wall wall-exterior"/>
    <!-- Left wall -->
    <line x1="0" y1="0" x2="0" y2="1050" class="wall wall-exterior"/>
    <!-- Bottom wall -->
    <line x1="0" y1="1050" x2="1800" y2="1050" class="wall wall-exterior"/>
    <!-- Right wall -->
    <line x1="1800" y1="0" x2="1800" y2="1050" class="wall wall-exterior"/>

    <!-- Interior walls -->
    <!-- Bedroom 1 / Bedroom 2 divider -->
    <line x1="550" y1="0" x2="550" y2="200" class="wall wall-interior"/>
    <line x1="550" y1="350" x2="550" y2="550" class="wall wall-interior"/>
    <!-- Bedroom 2 / Guest Bedroom divider -->
    <line x1="1050" y1="0" x2="1050" y2="200" class="wall wall-interior"/>
    <line x1="1050" y1="350" x2="1050" y2="550" class="wall wall-interior"/>
    <!-- Top rooms to hallway/lower (y=550) -->
    <line x1="0" y1="550" x2="350" y2="550" class="wall wall-interior"/>
    <line x1="350" y1="550" x2="500" y2="550" class="wall wall-interior"/>
    <line x1="640" y1="550" x2="800" y2="550" class="wall wall-interior"/>
    <line x1="800" y1="550" x2="900" y2="550" class="wall wall-interior"/>
    <line x1="1040" y1="550" x2="1150" y2="550" class="wall wall-interior"/>
    <line x1="1150" y1="550" x2="1800" y2="550" class="wall wall-interior"/>
    <!-- Master bedroom east wall -->
    <line x1="350" y1="550" x2="350" y2="1050" class="wall wall-interior"/>
    <!-- Hallway south wall -->
    <line x1="350" y1="750" x2="1150" y2="750" class="wall wall-interior"/>
    <!-- Bathroom west wall -->
    <line x1="1150" y1="550" x2="1150" y2="1050" class="wall wall-interior"/>
    <!-- Closet west wall -->
    <line x1="1500" y1="550" x2="1500" y2="700" class="wall wall-interior"/>
    <line x1="1500" y1="840" x2="1500" y2="1050" class="wall wall-interior"/>

    <!-- Stairwell (matching floor 1 position) -->
    <rect x="850" y="560" width="180" height="180" class="stairwell" data-stairwell="both"/>
  </g>

  <!-- ═══ Doors ═══ -->
  <g class="doors">
    <!-- Bedroom 1 → Bedroom 2 (shared wall) -->
    <line x1="550" y1="200" x2="550" y2="350" class="door"/>
    <!-- Bedroom 2 → Guest Bedroom -->
    <line x1="1050" y1="200" x2="1050" y2="350" class="door"/>
    <!-- Bedroom 1 → Hallway -->
    <line x1="500" y1="550" x2="640" y2="550" class="door"/>
    <!-- Bedroom 2 → Hallway -->
    <line x1="900" y1="550" x2="1040" y2="550" class="door"/>
    <!-- Master Bedroom → Hallway -->
    <line x1="350" y1="600" x2="350" y2="740" class="door"/>
    <!-- Hallway → Bathroom -->
    <line x1="1150" y1="600" x2="1150" y2="740" class="door"/>
    <!-- Bathroom → Closet -->
    <line x1="1500" y1="700" x2="1500" y2="840" class="door"/>
  </g>

  <!-- ═══ Windows ═══ -->
  <g class="windows">
    <!-- Bedroom 1 windows -->
    <line x1="100" y1="0" x2="300" y2="0" class="window"/>
    <line x1="0" y1="100" x2="0" y2="300" class="window"/>
    <!-- Bedroom 2 windows -->
    <line x1="700" y1="0" x2="900" y2="0" class="window"/>
    <!-- Guest Bedroom windows -->
    <line x1="1200" y1="0" x2="1450" y2="0" class="window"/>
    <line x1="1800" y1="100" x2="1800" y2="350" class="window"/>
    <!-- Master Bedroom windows -->
    <line x1="0" y1="650" x2="0" y2="850" class="window"/>
    <line x1="100" y1="1050" x2="300" y2="1050" class="window"/>
    <!-- Bathroom window -->
    <line x1="1800" y1="650" x2="1800" y2="850" class="window"/>
  </g>

  <!-- ═══ Room Labels ═══ -->
  <g class="room-labels">
    <text x="275" y="290" class="label">Bedroom #1</text>
    <text x="800" y="290" class="label">Bedroom #2</text>
    <text x="1425" y="290" class="label">Guest Bedroom</text>
    <text x="750" y="665" class="label label-small">Hallway</text>
    <text x="175" y="810" class="label">Master<tspan x="175" dy="30">Bedroom</tspan></text>
    <text x="1325" y="810" class="label label-small">Bathroom</text>
    <text x="1650" y="810" class="label label-small">Closet</text>
    <text x="940" y="670" class="label label-tiny">▲▼ STAIRS</text>
  </g>

  <!-- ═══ Sensor positions ═══ -->
  <g class="sensors">
    <circle cx="900" cy="525" r="8" class="sensor sensor-tx"/>
    <circle cx="50" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="1750" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="50" cy="1000" r="6" class="sensor sensor-rx"/>
  </g>
</svg>
