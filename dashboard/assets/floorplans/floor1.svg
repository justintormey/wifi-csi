<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" class="floorplan" data-floor="1">
  <defs>
    <pattern id="grid1" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0,255,255,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background grid -->
  <rect width="1800" height="1050" fill="url(#grid1)" class="floor-bg"/>

  <!-- ═══ Rooms ═══ -->
  <g class="rooms">
    <!-- Garage: large room on the left -->
    <rect x="0" y="0" width="550" height="550" class="room room-garage" data-room="garage"/>
    <!-- Family Room: central main living area -->
    <rect x="550" y="0" width="700" height="550" class="room" data-room="family_room"/>
    <!-- Kitchen: top-right -->
    <rect x="1250" y="0" width="550" height="550" class="room" data-room="kitchen"/>
    <!-- Hallway: central corridor -->
    <rect x="550" y="550" width="700" height="200" class="room room-hallway" data-room="hallway"/>
    <!-- Dining Room: bottom-left -->
    <rect x="0" y="550" width="550" height="500" class="room" data-room="dining"/>
    <!-- Utility: small room, bottom-center -->
    <rect x="1250" y="550" width="250" height="250" class="room" data-room="utility"/>
    <!-- Office: bottom-center-right -->
    <rect x="1250" y="800" width="250" height="250" class="room" data-room="office"/>
    <!-- Parlor: bottom-right -->
    <rect x="1500" y="550" width="300" height="500" class="room" data-room="parlor"/>
  </g>

  <!-- ═══ Walls (exterior) ═══ -->
  <g class="walls">
    <!-- Top wall -->
    <line x1="0" y1="0" x2="1800" y2="0" class="wall wall-exterior"/>
    <!-- Left wall -->
    <line x1="0" y1="0" x2="0" y2="1050" class="wall wall-exterior"/>
    <!-- Bottom wall -->
    <line x1="0" y1="1050" x2="1800" y2="1050" class="wall wall-exterior"/>
    <!-- Right wall -->
    <line x1="1800" y1="0" x2="1800" y2="1050" class="wall wall-exterior"/>

    <!-- Interior walls -->
    <!-- Garage / Family Room divider (x=550) -->
    <line x1="550" y1="0" x2="550" y2="200" class="wall wall-interior"/>
    <line x1="550" y1="350" x2="550" y2="550" class="wall wall-interior"/>
    <!-- Family Room / Kitchen divider (x=1250) -->
    <line x1="1250" y1="0" x2="1250" y2="200" class="wall wall-interior"/>
    <line x1="1250" y1="350" x2="1250" y2="550" class="wall wall-interior"/>
    <!-- Garage to Dining divider (x=550, lower) -->
    <line x1="550" y1="550" x2="550" y2="1050" class="wall wall-interior"/>
    <!-- Top rooms to hallway band (y=550) -->
    <line x1="0" y1="550" x2="550" y2="550" class="wall wall-interior"/>
    <line x1="550" y1="550" x2="650" y2="550" class="wall wall-interior"/>
    <line x1="800" y1="550" x2="1050" y2="550" class="wall wall-interior"/>
    <line x1="1150" y1="550" x2="1250" y2="550" class="wall wall-interior"/>
    <line x1="1250" y1="550" x2="1800" y2="550" class="wall wall-interior"/>
    <!-- Hallway south wall (y=750) -->
    <line x1="550" y1="750" x2="1250" y2="750" class="wall wall-interior"/>
    <!-- Dining / Hallway boundary -->
    <line x1="0" y1="550" x2="200" y2="550" class="wall wall-interior"/>
    <line x1="350" y1="550" x2="550" y2="550" class="wall wall-interior"/>
    <!-- Right section: Utility / Office divider (y=800) -->
    <line x1="1250" y1="800" x2="1500" y2="800" class="wall wall-interior"/>
    <!-- Utility+Office / Parlor divider (x=1500) -->
    <line x1="1500" y1="550" x2="1500" y2="700" class="wall wall-interior"/>
    <line x1="1500" y1="820" x2="1500" y2="1050" class="wall wall-interior"/>
    <!-- Kitchen / right rooms divider (x=1250, lower) -->
    <line x1="1250" y1="550" x2="1250" y2="1050" class="wall wall-interior"/>

    <!-- Stairwell area (in hallway) -->
    <rect x="850" y="560" width="180" height="180" class="stairwell" data-stairwell="up"/>
  </g>

  <!-- ═══ Doors ═══ -->
  <g class="doors">
    <!-- Garage → Family Room -->
    <line x1="550" y1="200" x2="550" y2="350" class="door"/>
    <!-- Family Room → Kitchen -->
    <line x1="1250" y1="200" x2="1250" y2="350" class="door"/>
    <!-- Family Room → Hallway -->
    <line x1="650" y1="550" x2="800" y2="550" class="door"/>
    <!-- Kitchen → Hallway -->
    <line x1="1050" y1="550" x2="1150" y2="550" class="door"/>
    <!-- Dining Room → Hallway -->
    <line x1="200" y1="550" x2="350" y2="550" class="door"/>
    <!-- Hallway → Utility -->
    <line x1="1250" y1="600" x2="1250" y2="740" class="door"/>
    <!-- Utility → Office -->
    <line x1="1300" y1="800" x2="1440" y2="800" class="door"/>
    <!-- Hallway → Parlor -->
    <line x1="1500" y1="700" x2="1500" y2="820" class="door"/>
    <!-- Front door (parlor exterior) -->
    <line x1="1800" y1="700" x2="1800" y2="850" class="door door-exterior"/>
    <!-- Garage door -->
    <line x1="150" y1="0" x2="400" y2="0" class="door door-garage"/>
  </g>

  <!-- ═══ Windows ═══ -->
  <g class="windows">
    <!-- Garage windows (left) -->
    <line x1="0" y1="100" x2="0" y2="300" class="window"/>
    <!-- Family room windows (top) -->
    <line x1="700" y1="0" x2="900" y2="0" class="window"/>
    <line x1="1000" y1="0" x2="1150" y2="0" class="window"/>
    <!-- Kitchen windows (top + right) -->
    <line x1="1400" y1="0" x2="1650" y2="0" class="window"/>
    <line x1="1800" y1="100" x2="1800" y2="350" class="window"/>
    <!-- Dining room windows (left + bottom) -->
    <line x1="0" y1="650" x2="0" y2="850" class="window"/>
    <line x1="100" y1="1050" x2="350" y2="1050" class="window"/>
    <!-- Parlor window (right) -->
    <line x1="1800" y1="600" x2="1800" y2="680" class="window"/>
    <!-- Office window (bottom) -->
    <line x1="1300" y1="1050" x2="1450" y2="1050" class="window"/>
  </g>

  <!-- ═══ Room Labels ═══ -->
  <g class="room-labels">
    <text x="275" y="290" class="label">Garage</text>
    <text x="900" y="290" class="label">Family Room</text>
    <text x="1525" y="290" class="label">Kitchen</text>
    <text x="900" y="665" class="label label-small">Hallway</text>
    <text x="275" y="810" class="label">Dining Room</text>
    <text x="1375" y="690" class="label label-small">Utility</text>
    <text x="1375" y="940" class="label label-small">Office</text>
    <text x="1650" y="810" class="label">Parlor</text>
    <text x="940" y="670" class="label label-tiny">▲ UP</text>
  </g>

  <!-- ═══ Sensor positions ═══ -->
  <g class="sensors">
    <!-- TX (ceiling center of family room) -->
    <circle cx="900" cy="400" r="8" class="sensor sensor-tx"/>
    <!-- RX units -->
    <circle cx="50" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="1750" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="50" cy="1000" r="6" class="sensor sensor-rx"/>
  </g>
</svg>
