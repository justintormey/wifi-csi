<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" class="floorplan" data-floor="1">
  <defs>
    <pattern id="grid1" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0,255,255,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background grid -->
  <rect width="1800" height="1050" fill="url(#grid1)" class="floor-bg"/>

  <!-- ═══ Rooms ═══ -->
  <g class="rooms">
    <!-- Parlor: upper-left (front of house) -->
    <rect x="0" y="0" width="450" height="450" class="room" data-room="parlor"/>
    <!-- Office: lower-left -->
    <rect x="0" y="550" width="450" height="500" class="room" data-room="office"/>
    <!-- Hallway: central corridor around stairwell -->
    <rect x="450" y="350" width="150" height="300" class="room room-hallway" data-room="hallway"/>
    <!-- Utility: small room, below hallway -->
    <rect x="450" y="650" width="150" height="200" class="room" data-room="utility"/>
    <!-- Dining Room: upper-center -->
    <rect x="600" y="0" width="350" height="550" class="room" data-room="dining"/>
    <!-- Kitchen: lower-center -->
    <rect x="600" y="550" width="300" height="500" class="room" data-room="kitchen"/>
    <!-- Family Room: main body (center-right, full height) -->
    <rect x="950" y="0" width="350" height="1050" class="room" data-room="family_room"/>
    <!-- Family Room: upper extension beside garage -->
    <rect x="1300" y="0" width="500" height="350" class="room" data-room="family_room"/>
    <!-- Garage: right side, NOT full height (~65%) -->
    <rect x="1300" y="350" width="500" height="700" class="room room-garage" data-room="garage"/>
  </g>

  <!-- ═══ Walls (exterior) ═══ -->
  <g class="walls">
    <!-- Top wall with front entrance notch near Parlor/Hallway -->
    <line x1="0" y1="0" x2="400" y2="0" class="wall wall-exterior"/>
    <!-- Front entrance notch -->
    <line x1="400" y1="0" x2="400" y2="80" class="wall wall-exterior"/>
    <line x1="400" y1="80" x2="500" y2="80" class="wall wall-exterior"/>
    <line x1="500" y1="80" x2="500" y2="0" class="wall wall-exterior"/>
    <!-- Top wall continues -->
    <line x1="500" y1="0" x2="1800" y2="0" class="wall wall-exterior"/>
    <!-- Right wall -->
    <line x1="1800" y1="0" x2="1800" y2="1050" class="wall wall-exterior"/>
    <!-- Bottom wall -->
    <line x1="0" y1="1050" x2="1800" y2="1050" class="wall wall-exterior"/>
    <!-- Left wall -->
    <line x1="0" y1="0" x2="0" y2="1050" class="wall wall-exterior"/>

    <!-- ── Interior walls ── -->

    <!-- Parlor south wall (y=450) -->
    <line x1="0" y1="450" x2="300" y2="450" class="wall wall-interior"/>
    <line x1="400" y1="450" x2="450" y2="450" class="wall wall-interior"/>

    <!-- Office north wall (y=550) -->
    <line x1="0" y1="550" x2="300" y2="550" class="wall wall-interior"/>
    <line x1="400" y1="550" x2="450" y2="550" class="wall wall-interior"/>

    <!-- Parlor/Office east wall (x=450) -->
    <line x1="450" y1="0" x2="450" y2="350" class="wall wall-interior"/>
    <line x1="450" y1="650" x2="450" y2="1050" class="wall wall-interior"/>

    <!-- Hallway/Utility divider (y=650) -->
    <line x1="450" y1="650" x2="600" y2="650" class="wall wall-interior"/>

    <!-- Utility south wall (y=850) -->
    <line x1="450" y1="850" x2="600" y2="850" class="wall wall-interior"/>

    <!-- Dining/Kitchen column east wall (x=600) -->
    <line x1="600" y1="0" x2="600" y2="350" class="wall wall-interior"/>
    <line x1="600" y1="500" x2="600" y2="550" class="wall wall-interior"/>
    <line x1="600" y1="550" x2="600" y2="1050" class="wall wall-interior"/>

    <!-- Dining/Kitchen divider (y=550) -->
    <line x1="600" y1="550" x2="950" y2="550" class="wall wall-interior"/>

    <!-- Dining/Kitchen east wall (x=950) — Family Room boundary -->
    <line x1="950" y1="0" x2="950" y2="300" class="wall wall-interior"/>
    <line x1="950" y1="450" x2="950" y2="550" class="wall wall-interior"/>
    <line x1="950" y1="700" x2="950" y2="1050" class="wall wall-interior"/>

    <!-- Garage / Family Room divider (y=350 from x=1300 to x=1800) -->
    <line x1="1300" y1="350" x2="1500" y2="350" class="wall wall-interior"/>
    <line x1="1650" y1="350" x2="1800" y2="350" class="wall wall-interior"/>

    <!-- Family Room / Garage west wall at extension (x=1300) -->
    <line x1="1300" y1="350" x2="1300" y2="1050" class="wall wall-interior"/>

    <!-- Stairwell area -->
    <rect x="460" y="380" width="130" height="180" class="stairwell" data-stairwell="up"/>
  </g>

  <!-- ═══ Doors ═══ -->
  <g class="doors">
    <!-- Parlor → Hallway (gap in Parlor south wall) -->
    <line x1="300" y1="450" x2="400" y2="450" class="door"/>
    <!-- Office → Hallway (gap in Office north wall) -->
    <line x1="300" y1="550" x2="400" y2="550" class="door"/>
    <!-- Hallway → Dining (gap in x=600 wall) -->
    <line x1="600" y1="350" x2="600" y2="500" class="door"/>
    <!-- Dining → Family Room (gap in x=950 wall) -->
    <line x1="950" y1="300" x2="950" y2="450" class="door"/>
    <!-- Kitchen → Family Room (gap in x=950 wall) -->
    <line x1="950" y1="550" x2="950" y2="700" class="door"/>
    <!-- Garage → Family Room (gap in y=350 wall) -->
    <line x1="1500" y1="350" x2="1650" y2="350" class="door"/>
    <!-- Front door (Parlor, top wall notch) -->
    <line x1="420" y1="0" x2="480" y2="0" class="door door-exterior"/>
    <!-- Garage door (right wall) -->
    <line x1="1800" y1="550" x2="1800" y2="850" class="door door-garage"/>
  </g>

  <!-- ═══ Windows ═══ -->
  <g class="windows">
    <!-- Parlor windows (top + left) -->
    <line x1="100" y1="0" x2="300" y2="0" class="window"/>
    <line x1="0" y1="100" x2="0" y2="300" class="window"/>
    <!-- Office windows (left + bottom) -->
    <line x1="0" y1="650" x2="0" y2="850" class="window"/>
    <line x1="100" y1="1050" x2="300" y2="1050" class="window"/>
    <!-- Dining windows (top) -->
    <line x1="650" y1="0" x2="850" y2="0" class="window"/>
    <!-- Kitchen windows (bottom) -->
    <line x1="650" y1="1050" x2="850" y2="1050" class="window"/>
    <!-- Family Room windows (top + bottom) -->
    <line x1="1000" y1="0" x2="1200" y2="0" class="window"/>
    <line x1="1000" y1="1050" x2="1200" y2="1050" class="window"/>
    <!-- Garage windows (top + right) -->
    <line x1="1400" y1="0" x2="1550" y2="0" class="window"/>
    <line x1="1800" y1="400" x2="1800" y2="530" class="window"/>
    <line x1="1800" y1="870" x2="1800" y2="1000" class="window"/>
  </g>

  <!-- ═══ Room Labels ═══ -->
  <g class="room-labels">
    <text x="225" y="230" class="label">Parlor</text>
    <text x="225" y="800" class="label">Office</text>
    <text x="525" y="510" class="label label-tiny">▲ UP</text>
    <text x="525" y="770" class="label label-tiny">Utility</text>
    <text x="775" y="280" class="label">Dining Room</text>
    <text x="750" y="800" class="label label-small">Kitchen</text>
    <text x="1125" y="525" class="label">Family Room</text>
    <text x="1550" y="700" class="label">Garage</text>
  </g>

  <!-- ═══ Sensor positions ═══ -->
  <g class="sensors">
    <!-- TX (ceiling center of family room main body) -->
    <circle cx="1125" cy="525" r="8" class="sensor sensor-tx"/>
    <!-- RX units (corners of the house) -->
    <circle cx="50" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="1750" cy="50" r="6" class="sensor sensor-rx"/>
    <circle cx="50" cy="1000" r="6" class="sensor sensor-rx"/>
  </g>
</svg>
