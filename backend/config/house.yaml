# House configuration for WiFi CSI tracking system.
# Defines floor dimensions, TX channels, and stairwell transition zones.

floors:
  1:
    name: "Ground Floor"
    tx_channel: 1
    dimensions:
      width_m: 15.0
      depth_m: 12.0
      height_m: 2.7
    rooms:
      - name: "Kitchen"
      - name: "Living Room"
      - name: "Garage"

  2:
    name: "Second Floor"
    tx_channel: 6
    dimensions:
      width_m: 15.0
      depth_m: 12.0
      height_m: 2.7
    rooms:
      - name: "Master Bedroom"
      - name: "Bedroom 2"
      - name: "Bathroom"
      - name: "Hallway"

  3:
    name: "Third Floor / Attic"
    tx_channel: 11
    dimensions:
      width_m: 12.0
      depth_m: 10.0
      height_m: 2.4
    rooms:
      - name: "Office"
      - name: "Media Room"

# Stairwell transition zones.
# When a person is within a transition zone, the floor detector relaxes
# hysteresis and allows floor changes. Each zone connects two adjacent floors.
transition_zones:
  - name: "Main Stairwell"
    floors: [1, 2]
    # Bounding box in floor coordinates (same x,y on both floors)
    x_min: 7.0
    x_max: 9.0
    y_min: 5.0
    y_max: 7.0

  - name: "Upper Stairwell"
    floors: [2, 3]
    x_min: 7.0
    x_max: 9.0
    y_min: 5.0
    y_max: 7.0

# Cross-floor attenuation model (used for energy-based floor detection).
attenuation:
  same_floor_db: 0.0
  per_floor_db: 12.0  # ~10-15 dB per floor of separation
