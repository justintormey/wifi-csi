# House configuration for WiFi CSI tracking system.
# Based on actual floor plans of 14 Charleston Drive.
# House is landscape-oriented: ~18.0m wide × 10.5m deep.
# Defines floor dimensions, TX channels, and stairwell transition zones.

floors:
  1:
    name: "1st Floor"
    tx_channel: 1
    dimensions:
      width_m: 18.0
      depth_m: 10.5
      height_m: 2.7
    rooms:
      - name: "Parlor"
      - name: "Office"
      - name: "Hallway"
      - name: "Utility"
      - name: "Dining Room"
      - name: "Kitchen"
      - name: "Family Room"
      - name: "Garage"

  2:
    name: "2nd Floor"
    tx_channel: 6
    dimensions:
      width_m: 18.0
      depth_m: 10.5
      height_m: 2.7
    rooms:
      - name: "Master Bedroom"
      - name: "Closet"
      - name: "Bathroom"
      - name: "Guest Bedroom"
      - name: "Hallway"
      - name: "Bedroom #1"
      - name: "Bedroom #2"

  3:
    name: "Basement"
    tx_channel: 11
    dimensions:
      width_m: 18.0
      depth_m: 10.5
      height_m: 2.4
    rooms:
      - name: "Storage"
      - name: "Art Studio"
      - name: "Hallway"
      - name: "Recreation Area"
      - name: "Bar Area"
      - name: "Workshop"

# Stairwell transition zones.
# When a person is within a transition zone, the floor detector relaxes
# hysteresis and allows floor changes. Each zone connects two adjacent floors.
# Coordinates are in each floor's local meter system (landscape orientation).
transition_zones:
  - name: "Main Stairwell (1st→2nd)"
    floors: [1, 2]
    # Stairwell on 1st floor at hallway area (x=5.0, y=4.5)
    x_min: 4.0
    x_max: 6.5
    y_min: 3.5
    y_max: 6.5

  - name: "Basement Stairwell (Basement→1st)"
    floors: [3, 1]
    # Stairwell on basement at hallway area (x=7.5, y=5.0)
    x_min: 6.0
    x_max: 9.0
    y_min: 3.5
    y_max: 6.5

# Cross-floor attenuation model (used for energy-based floor detection).
attenuation:
  same_floor_db: 0.0
  per_floor_db: 12.0  # ~10-15 dB per floor of separation
