# Sensor configuration for WiFi CSI tracking system.
# Based on actual floor plans of 14 Charleston Drive.
# Defines ESP32-S3 board MACs, roles (TX/RX), floor assignments,
# WiFi channels, and expected MQTT topics.

# ── Phase 1: Single floor (1st Floor) ──
# 1 TX + 3 RX boards. Phase 2 adds floors 2 and 3.

sensors:
  # ── Floor 1: 1st Floor (Channel 1) ──
  - mac: "aa:bb:cc:dd:01:00"
    role: tx
    floor: 1
    channel: 1
    position:
      x: 5.25   # center of family room
      y: 7.25
    label: "Floor 1 TX (family room ceiling)"

  - mac: "aa:bb:cc:dd:01:01"
    role: rx
    floor: 1
    channel: 1
    position:
      x: 0.5
      y: 0.5
    label: "Floor 1 RX-A (garage corner)"

  - mac: "aa:bb:cc:dd:01:02"
    role: rx
    floor: 1
    channel: 1
    position:
      x: 10.0
      y: 0.5
    label: "Floor 1 RX-B (garage corner right)"

  - mac: "aa:bb:cc:dd:01:03"
    role: rx
    floor: 1
    channel: 1
    position:
      x: 0.5
      y: 17.5
    label: "Floor 1 RX-C (parlor corner)"

  # ── Floor 2: 2nd Floor (Channel 6) ──
  - mac: "aa:bb:cc:dd:02:00"
    role: tx
    floor: 2
    channel: 6
    position:
      x: 5.25
      y: 5.25
    label: "Floor 2 TX (hallway ceiling)"

  - mac: "aa:bb:cc:dd:02:01"
    role: rx
    floor: 2
    channel: 6
    position:
      x: 0.5
      y: 0.5
    label: "Floor 2 RX-A (bedroom 1 corner)"

  - mac: "aa:bb:cc:dd:02:02"
    role: rx
    floor: 2
    channel: 6
    position:
      x: 10.0
      y: 0.5
    label: "Floor 2 RX-B (bedroom 2 corner)"

  - mac: "aa:bb:cc:dd:02:03"
    role: rx
    floor: 2
    channel: 6
    position:
      x: 0.5
      y: 17.5
    label: "Floor 2 RX-C (master bedroom corner)"

  # ── Floor 3: Basement (Channel 11) ──
  - mac: "aa:bb:cc:dd:03:00"
    role: tx
    floor: 3
    channel: 11
    position:
      x: 5.25
      y: 5.25
    label: "Basement TX (hallway ceiling)"

  - mac: "aa:bb:cc:dd:03:01"
    role: rx
    floor: 3
    channel: 11
    position:
      x: 0.5
      y: 0.5
    label: "Basement RX-A (recreation area corner)"

  - mac: "aa:bb:cc:dd:03:02"
    role: rx
    floor: 3
    channel: 11
    position:
      x: 10.0
      y: 0.5
    label: "Basement RX-B (workshop corner)"

  - mac: "aa:bb:cc:dd:03:03"
    role: rx
    floor: 3
    channel: 11
    position:
      x: 0.5
      y: 17.5
    label: "Basement RX-C (storage corner)"

# MQTT topic pattern for CSI data.
# Each RX board publishes to: csi/{floor_id}/{rx_mac}
# Payload: 478-byte binary CsiPacket (see collector/csi_packet.py).
mqtt:
  broker_host: "localhost"
  broker_port: 1883
  topic_prefix: "csi"
  # Full topic pattern: csi/{floor_id}/{rx_mac}
  # Example: csi/1/aa:bb:cc:dd:01:01
  subscribe_pattern: "csi/#"
  keepalive_s: 60
  qos: 0  # QoS 0 for CSI — dropping frames is acceptable
